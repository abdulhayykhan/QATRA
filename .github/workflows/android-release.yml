name: Android Release

# Triggered by pushing a version tag (e.g. `git tag v1.2.0 && git push --tags`).
# Builds a signed release APK + AAB and publishes them as a GitHub Release.
# `workflow_dispatch` runs the same build for a dry run (artifacts only, no release).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed release and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1 and dependency cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Gradle wrapper
        shell: bash
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin

      - name: Write local.properties from GitHub secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > local.properties

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. A signed release cannot be built."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Restore google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 not set; Firebase (FCM/Auth) will be inert in this build."
          fi

      - name: Restore .env for the secrets Gradle plugin (optional)
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ENV_FILE:-}" ]; then
            printf '%s' "$ENV_FILE" > .env
          else
            echo "::warning::ENV_FILE not set; falling back to committed .env.example placeholders."
          fi

      - name: Derive version name and code
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # KEYSTORE_PATH, VERSION_NAME and VERSION_CODE were exported to the
      # environment via $GITHUB_ENV in the steps above.
      - name: Test, then assemble signed release APK and AAB
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # Unit tests are pure-JVM logic in the shared src/test source set (no
        # release-specific tests), so testDebugUnitTest is representative. AGP
        # 9.x only registers the unit-test task for the default testBuildType
        # (debug), so testReleaseUnitTest does not exist.
        run: ./gradlew testDebugUnitTest assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload build outputs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qatra-release-${{ env.VERSION_NAME }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "QATRA ${GITHUB_REF_NAME}" \
            --generate-notes \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab
