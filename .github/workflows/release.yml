name: Release Flutter APKs

permissions:
  contents: write
on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Flutter Analyze and Test
        working-directory: flutter_client
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings || true
          flutter test

      - name: Backend Tests
        working-directory: backend
        env:
          SECRET_KEY: dummy_secret_key_for_ci
          DATABASE_URL: sqlite:///./test.db
          S3_ACCESS_KEY_ID: dummy_access_key
          S3_SECRET_ACCESS_KEY: dummy_secret_key
          S3_ENDPOINT_URL: http://localhost:9000
          S3_HOSPITAL_SLIPS_BUCKET: dummy-slips
          S3_CNIC_DOCUMENTS_BUCKET: dummy-cnics
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          python -m pytest tests/

  build-and-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        working-directory: flutter_client
        run: flutter pub get

      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.QATRA_KEYSTORE_BASE64 }}
        run: |
          echo "$ENCODED_KEYSTORE" | base64 --decode > ${{ github.workspace }}/qatra-release.jks

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > flutter_client/android/app/google-services.json

      - name: Build universal APK
        working-directory: flutter_client
        env:
          QATRA_STORE_FILE: ${{ github.workspace }}/qatra-release.jks
          QATRA_KEY_ALIAS: ${{ secrets.QATRA_KEY_ALIAS }}
          QATRA_KEY_PASSWORD: ${{ secrets.QATRA_KEY_PASSWORD }}
          QATRA_STORE_PASSWORD: ${{ secrets.QATRA_STORE_PASSWORD }}
        run: flutter build apk --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body: "🚀 Welcome to the latest release of QATRA!\n\n**Instructions:**\nDownload the `app-release.apk` file below and open it on your Android device to install the app. If you are prompted, make sure to allow installations from unknown sources."
          files: |
            flutter_client/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
