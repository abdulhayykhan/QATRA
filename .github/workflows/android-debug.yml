name: Android Debug Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1 and dependency cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: false
          gradle-home-cache-excludes: |
            caches/configuration-cache

      - name: Generate Gradle wrapper
        shell: bash
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin --no-configuration-cache

      - name: Write local.properties from GitHub secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > local.properties

      - name: Create debug keystore if missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -dname "CN=Qatra Debug, O=Alkhidmat Foundation, C=PK" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore debug.keystore -storepass android -keypass android
          fi

      - name: Run dev debug unit tests
        run: ./gradlew testDevDebugUnitTest --no-daemon --no-configuration-cache --stacktrace

      - name: Assemble dev debug APK
        run: ./gradlew assembleDevDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qatra-dev-debug-apk
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Generate version tag
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: version
        shell: bash
        run: |
          VERSION="v1.0.0-build.${{ github.run_number }}"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Generated version: $VERSION"

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "QATRA $TAG (Debug)" \
            --generate-notes \
            --prerelease \
            app/build/outputs/apk/dev/debug/*.apk
